<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Domain Ops — Approval</title>
  <style>
    :root { --bg:#0f1115; --panel:#171a21; --line:#2a2f3a; --fg:#e6e8ee; --muted:#9aa3b2; --accent:#5b8def; --ok:#3fb950; --warn:#d29922; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; }
    header { padding:16px 20px; border-bottom:1px solid var(--line); }
    h1 { margin:0; font-size:16px; font-weight:600; }
    main { display:grid; grid-template-columns: 320px 1fr; gap:16px; padding:16px 20px; }
    section { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; }
    label { display:block; color:var(--muted); font-size:12px; margin:8px 0 4px; }
    select, textarea { width:100%; background:#0c0e13; color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:8px; font:inherit; }
    textarea { min-height:90px; resize:vertical; }
    button { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:8px 12px; font:inherit; cursor:pointer; margin:6px 6px 0 0; }
    button:disabled { opacity:.4; cursor:not-allowed; }
    button.ghost { background:transparent; border:1px solid var(--line); color:var(--fg); }
    pre { background:#0c0e13; border:1px solid var(--line); border-radius:8px; padding:10px; overflow:auto; max-height:340px; white-space:pre-wrap; word-break:break-word; }
    .muted { color:var(--muted); }
    .ok { color:var(--ok); }
    .warn { color:var(--warn); }
    .row { display:flex; gap:8px; align-items:center; }
    .badge { display:inline-block; border:1px solid var(--line); border-radius:999px; padding:1px 8px; font-size:11px; color:var(--muted); }
  </style>
</head>
<body>
  <header>
    <h1>Domain Ops — Approval</h1>
    <div class="muted" style="font-size:12px">plan → approve → apply → verify → revert</div>
  </header>
  <main>
    <section>
      <label for="op">Operation</label>
      <select id="op"></select>
      <div id="manifest" class="muted" style="font-size:12px; margin-top:8px"></div>

      <label for="params">Params (JSON)</label>
      <textarea id="params">{}</textarea>

      <button id="plan">Plan</button>
      <button id="reject" class="ghost" disabled>Reject</button>
      <button id="revert" class="ghost" disabled>Revert</button>
      <div id="status" class="muted" style="margin-top:10px; font-size:12px"></div>
    </section>

    <section>
      <div class="row"><span class="badge" id="phase">idle</span></div>
      <label>Plan (review)</label>
      <pre id="planOut" class="muted">— nothing planned yet —</pre>

      <button id="apply" disabled>Approve &amp; Apply</button>

      <label>Result</label>
      <pre id="resultOut" class="muted">— nothing applied yet —</pre>
    </section>
  </main>

  <script>
    const EXAMPLE_PARAMS = {
      rename_author: { author_id: "a1", new_name: "Ada King" },
      merge_authors: { source_id: "a2", target_id: "a1" },
      delete_book: { book_id: "b1" },
    };

    let manifests = [];
    let current = null;   // selected manifest
    let plan = null;      // current plan dict
    let revertToken = null;

    const $ = (id) => document.getElementById(id);
    const setStatus = (text, cls = "muted") => { $("status").className = cls; $("status").textContent = text; };
    const setPhase = (text) => { $("phase").textContent = text; };

    async function api(method, path, body) {
      const res = await fetch(path, {
        method,
        headers: body ? { "Content-Type": "application/json" } : undefined,
        body: body ? JSON.stringify(body) : undefined,
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
      return data;
    }

    async function load() {
      try {
        const { operations } = await api("GET", "/operations");
        manifests = operations;
        $("op").innerHTML = operations
          .map((o) => `<option value="${o.name}">${o.name} · ${o.level}</option>`)
          .join("");
        $("op").onchange = selectOperation;
        selectOperation();
      } catch (err) {
        setStatus(`Failed to load operations: ${err.message}`, "warn");
      }
    }

    function selectOperation() {
      current = manifests.find((m) => m.name === $("op").value) || null;
      plan = null;
      $("apply").disabled = true;
      $("reject").disabled = true;
      $("planOut").textContent = "— nothing planned yet —";
      $("resultOut").textContent = "— nothing applied yet —";
      $("revert").disabled = !revertToken;
      setPhase("idle");
      if (!current) return;
      $("manifest").innerHTML = [
        current.description,
        `effects: ${(current.effects || []).join(", ")}`,
        `references: ${(current.reference_coverage || []).map((c) => c.reference).join(", ") || "—"}`,
        `boundary: ${current.transaction_boundary || "—"}`,
      ].join("<br/>");
      $("params").value = JSON.stringify(EXAMPLE_PARAMS[current.name] || {}, null, 2);
    }

    $("plan").onclick = async () => {
      if (!current) return;
      try {
        const params = JSON.parse($("params").value || "{}");
        plan = await api("POST", `/operations/${current.name}/plan`, { params, version: current.version });
        $("planOut").className = "";
        $("planOut").textContent = JSON.stringify(plan, null, 2);
        $("apply").disabled = false;
        $("reject").disabled = false;
        setPhase("plan_pending");
        setStatus("Plan ready — review the diff, then approve.");
      } catch (err) {
        setStatus(`Plan failed: ${err.message}`, "warn");
      }
    };

    $("apply").onclick = async () => {
      if (!plan) return;
      try {
        const result = await api("POST", `/operations/${plan.operation}/apply`, {
          plan_id: plan.plan_id, params: plan.params, version: plan.version,
        });
        $("resultOut").className = result.verification && result.verification.ok ? "ok" : "warn";
        $("resultOut").textContent = JSON.stringify(result, null, 2);
        revertToken = result.revert_token;
        $("revert").disabled = !revertToken;
        $("apply").disabled = true;
        $("reject").disabled = true;
        setPhase("plan_result");
        setStatus(`Applied (${result.status}) — verified: ${result.verification ? result.verification.ok : "n/a"}.`,
          result.verification && result.verification.ok ? "ok" : "warn");
      } catch (err) {
        setStatus(`Apply failed: ${err.message}`, "warn");
      }
    };

    $("reject").onclick = () => {
      plan = null;
      $("planOut").textContent = "— plan rejected —";
      $("apply").disabled = true;
      $("reject").disabled = true;
      setPhase("rejected");
      setStatus("Plan rejected — nothing was applied.");
    };

    $("revert").onclick = async () => {
      if (!revertToken) return;
      try {
        await api("POST", "/revert", { token: revertToken });
        revertToken = null;
        $("revert").disabled = true;
        setPhase("reverted");
        setStatus("Reverted to the pre-operation snapshot.", "ok");
      } catch (err) {
        setStatus(`Revert failed: ${err.message}`, "warn");
      }
    };

    load();
  </script>
</body>
</html>
