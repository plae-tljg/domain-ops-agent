[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "domain-ops-agent"
version = "0.1.0"
description = "Make a domain's valid operations an AI agent's action space: transactional, invariant-preserving, approval-gated, verifiable."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "plae-tljg" }]
keywords = ["ai-agent", "transactions", "domain", "approval", "invariants"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
